<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underwriting Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEDE8; --paper-2:#F6F6F3; --ink:#16181A; --ink-soft:#4A5560; --rule:#C6C9C0;
  --seal:#8E2B26; --stamp:#24564C; --refer:#A9711A;
  --shadow:0 1px 0 rgba(22,24,26,.06), 0 12px 30px -18px rgba(22,24,26,.5);
  --serif:"Spectral",Georgia,serif;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 56px;position:relative}

/* top bar */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--rule);padding-top:14px}
.tabs{display:flex}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:9px 13px 8px;cursor:pointer;margin-bottom:-1px;display:inline-flex;align-items:center;gap:5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible,.gear:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.gear{appearance:none;background:none;border:0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:9px 4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.navicon{width:14px;height:14px;flex:none}
.gear[aria-expanded="true"]{color:var(--ink)}
.track{height:2px;background:var(--rule);margin-top:0}
.track span{display:block;height:2px;background:var(--ink);width:0;transition:width .25s ease}

/* settings sheet */
.sheet{position:absolute;right:18px;top:52px;z-index:20;width:min(360px,calc(100vw - 36px));background:var(--paper-2);border:1px solid var(--ink);border-radius:3px;box-shadow:0 18px 40px -20px rgba(22,24,26,.6);padding:6px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 15px}
.srow + .srow{border-top:1px solid var(--rule)}
.srow label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);flex:none}
.srow select,.srow input[type=url]{font-family:var(--sans);font-size:14px;background:none;border:0;color:var(--ink);text-align:right;max-width:63%;cursor:pointer}
.srow select:focus-visible,.srow input:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.toggle{appearance:none;background:none;border:1px solid var(--rule);border-radius:20px;width:42px;height:23px;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--ink-soft);transition:transform .16s ease}
.toggle[aria-pressed="true"]{border-color:var(--ink);background:var(--ink)}
.toggle[aria-pressed="true"]::after{transform:translateX(19px);background:var(--paper-2)}
.sblock{padding:11px 15px;border-top:1px solid var(--rule)}
.sblock .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:7px}
.sblock input[type=url]{width:100%;text-align:left;font-size:13px;border:1px solid var(--rule);background:var(--paper);padding:7px 9px;border-radius:2px;max-width:none}
.mini{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--paper);border:1px solid var(--rule);color:var(--ink);padding:7px 10px;border-radius:2px;cursor:pointer;margin:8px 6px 0 0}
.mini:hover{border-color:var(--ink)}
.mini[disabled]{opacity:.5;cursor:default}
.status{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5}

/* card */
.card{position:relative;background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);padding:22px 20px 20px;margin-top:20px;min-height:340px;display:flex;flex-direction:column;overflow:hidden;touch-action:none;cursor:pointer;transition:transform .22s ease, opacity .22s ease}
.card.dragging{transition:none}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink-soft);opacity:.35}
.card.is-trap::before{background:var(--seal);opacity:1}
.filebar{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:9px}
.filebar .sec{color:var(--ink)}
.termline{display:flex;align-items:flex-start;gap:10px;margin-top:24px}
.term{font-family:var(--serif);font-weight:600;font-size:clamp(27px,7vw,42px);line-height:1.15;letter-spacing:-.015em;margin:0;flex:1}
.term.zh{font-family:var(--sans);font-weight:700;font-size:clamp(24px,6vw,34px);letter-spacing:.01em}
.full{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.4;color:var(--ink-soft);margin-top:7px}
.pos{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.4;color:var(--ink-soft);margin-top:7px}
.spk{flex:none;appearance:none;background:none;border:1px solid var(--rule);color:var(--ink-soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;margin-top:6px}
.spk:hover{border-color:var(--ink);color:var(--ink)}
.spk.sm{width:26px;height:26px;font-size:12px;margin-top:0}
.volicon{width:16px;height:16px}
.spk.sm .volicon{width:13px;height:13px}
.collo{font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink-soft);margin-top:14px}
.patexp{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink-soft);margin-top:3px}
.exwrap{display:flex;align-items:flex-start;gap:9px;margin-top:14px;touch-action:auto}
.exline{font-family:var(--serif);font-size:17px;line-height:1.6;color:#22262A;flex:1;touch-action:auto;user-select:text;-webkit-user-select:text}
.exline b{font-weight:600;box-shadow:inset 0 -7px 0 rgba(169,113,26,.28)}
.answer{margin-top:20px;border-top:1px solid var(--rule);padding-top:16px}
.answer .zh{font-family:var(--sans);font-weight:700;font-size:21px;line-height:1.4}
.answer .en{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.25}
.answer .meaning{margin-top:8px;font-size:15px;color:#22262A}
.defen{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.5;color:var(--ink-soft);margin-top:6px}
.breakdown{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink-soft);margin-top:8px}
.note{margin-top:14px;font-size:14px;line-height:1.5;color:var(--ink-soft)}
.is-trap .note{color:#8E2B26}
.spacer{flex:1}
.clozeZh{font-family:var(--sans);font-weight:700;font-size:clamp(20px,5vw,26px);line-height:1.35;margin-top:22px}
.blank{display:inline-block;min-width:76px;text-align:center;border-bottom:2px solid var(--seal);color:var(--seal);font-family:var(--mono);font-weight:500}
.typewrap{display:flex;gap:8px;margin-top:16px}
.typein{flex:1;font-family:var(--serif);font-size:20px;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);border-radius:2px;color:var(--ink)}
.typein:focus-visible{outline:2px solid var(--stamp);outline-offset:1px}
.typein:disabled{opacity:.7}
.verdict{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:14px}
.verdict.ok{color:var(--stamp)}.verdict.near{color:var(--refer)}.verdict.no{color:var(--seal)}
.stampmark{position:absolute;right:16px;bottom:24px;pointer-events:none;font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.2em;text-transform:uppercase;border:2.5px solid currentColor;border-radius:3px;padding:5px 11px;transform:rotate(-11deg) scale(1.9);opacity:0}
.stampmark.go{animation:slam .42s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes slam{0%{opacity:0;transform:rotate(-11deg) scale(1.9)}60%{opacity:.85;transform:rotate(-11deg) scale(.97)}100%{opacity:.8;transform:rotate(-11deg) scale(1)}}
.stampmark.approve{color:var(--stamp)}.stampmark.refer{color:var(--refer)}.stampmark.decline{color:var(--seal)}
.ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--mono);font-size:20px;letter-spacing:.2em;text-transform:uppercase;border:3px solid currentColor;border-radius:4px;padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .1s}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.actions.one{grid-template-columns:1fr;max-width:280px;margin-left:auto;margin-right:auto}
.btn{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--paper-2);border:1px solid var(--ink);color:var(--ink);padding:13px 8px;border-radius:2px;cursor:pointer;line-height:1.3}
.btn small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:0;text-transform:none;opacity:.6;margin-top:2px}
.btn:hover{background:var(--ink);color:var(--paper-2)}
.btn.d{border-color:var(--seal);color:var(--seal)}.btn.d:hover{background:var(--seal);color:var(--paper-2)}
.btn.r{border-color:var(--refer);color:var(--refer)}.btn.r:hover{background:var(--refer);color:var(--paper-2)}
.btn.a{border-color:var(--stamp);color:var(--stamp)}.btn.a:hover{background:var(--stamp);color:var(--paper-2)}
.opts{display:grid;gap:8px;margin-top:22px}
.opt{text-align:left;font-family:var(--sans);font-size:15px;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);padding:11px 13px;border-radius:2px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding-top:3px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--stamp);background:rgba(36,86,76,.08)}
.opt.wrong{border-color:var(--seal);background:rgba(142,43,38,.07)}
.opt:disabled{cursor:default}

/* ledger */
.search{width:100%;font-family:var(--sans);font-size:15px;padding:11px 12px;border:1px solid var(--rule);background:var(--paper-2);border-radius:2px;margin:18px 0 4px}
.lcontrols{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.chip{font-family:var(--mono);font-size:12px;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink);padding:7px 10px;border-radius:2px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-left:auto}
.row{border-bottom:1px solid var(--rule);padding:13px 0}
.row .rt{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25}
.row .rf{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-soft)}
.row .rz{font-weight:500;font-size:15px;margin-top:2px}
.row .rm{font-size:14px;color:#22262A;margin-top:3px}
.row .rc{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.row .re{font-family:var(--serif);font-size:15.5px;line-height:1.5;margin-top:3px;color:#22262A}
.row .re b{font-weight:600;box-shadow:inset 0 -6px 0 rgba(169,113,26,.25)}
.row .rn{font-size:13px;color:var(--ink-soft);margin-top:5px;border-left:2px solid var(--rule);padding-left:9px}
.row.trap .rn{border-left-color:var(--seal)}
.row .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase}
.sechead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-2);background:var(--ink);display:inline-block;padding:3px 8px;margin:24px 0 4px;border-radius:2px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.stat{border:1px solid var(--rule);background:var(--paper-2);padding:13px 14px;border-radius:2px}
.stat .n{font-family:var(--serif);font-size:31px;font-weight:600;line-height:1}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.boxrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.bar{height:13px;background:var(--ink);border-radius:1px;min-width:2px}
.bar.b1{background:var(--seal)}.bar.b2{background:#A9553A}.bar.b3{background:var(--refer)}.bar.b4{background:#5C7A4A}.bar.b5{background:var(--stamp)}
.chain{border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--paper-2);padding:13px 15px;margin-top:12px;border-radius:2px}
.chain h3{font-family:var(--sans);font-size:14px;margin:0 0 5px}
.chain p{margin:0;font-size:14px;line-height:1.65}
h2.blk{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:32px 0 0;font-weight:400}
.danger{font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--seal);color:var(--seal);padding:8px 12px;border-radius:2px;cursor:pointer;margin-top:26px}
.empty{border:1px dashed var(--rule);padding:34px 20px;text-align:center;border-radius:3px;margin-top:20px}
.empty .big{font-family:var(--serif);font-size:22px;font-weight:600}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){.stampmark.go{animation:none;opacity:.8;transform:rotate(-11deg) scale(1)}.card{transition:none}}
@media (max-width:420px){.card{padding:18px 15px 16px;min-height:310px}.btn{font-size:11px;letter-spacing:.05em;padding:12px 4px}}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="study"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.013 18.582 6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.597-1.16l2.309-4.679a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904L20 11.5"/><path d="M15 18h6"/><path d="M18 15v6"/></svg></button>
    <button class="tab" role="tab" aria-selected="false" data-view="ledger"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H3"/><path d="M15 12H3"/><path d="M17 19H3"/></svg></button>
    <button class="tab" role="tab" aria-selected="false" data-view="progress"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg></button>
  </nav>
  <button class="gear" id="gear" aria-expanded="false"><svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<div class="track"><span id="track"></span></div>

<div class="sheet" id="sheet" hidden>
  <div class="srow"><label for="secSel">章節</label><select id="secSel"></select></div>
  <div class="srow"><label for="modeSel">練習方式</label><select id="modeSel">
    <option value="auto">依階梯自動</option>
    <option value="recog">只練認詞</option>
    <option value="cloze">只練克漏字</option>
    <option value="type">只練打字</option>
    <option value="trap">陷阱辨義</option>
  </select></div>
  <div class="srow"><label for="ttsSel">發音</label><select id="ttsSel">
    <option value="off">手動</option>
    <option value="term">自動唸單字</option>
    <option value="both">自動唸單字＋例句</option>
  </select></div>
  <div class="srow"><label for="sizeSel">本輪張數</label><select id="sizeSel">
    <option value="10">10</option><option value="20">20</option>
    <option value="50">50</option><option value="0">全部</option>
  </select></div>
  <div class="srow"><label>只練陷阱字</label><button class="toggle" id="trapChip" aria-pressed="false" aria-label="只練陷阱字"></button></div>
  <div class="srow"><label>只練到期</label><button class="toggle" id="dueChip" aria-pressed="false" aria-label="只練到期"></button></div>
  <div class="srow"><label>認詞顯示例句</label><button class="toggle" id="exChip" aria-pressed="false" aria-label="認詞顯示例句"></button></div>
  <div class="srow"><label for="autoSel">自動同步</label><select id="autoSel">
    <option value="off">關閉</option>
    <option value="open">每次開啟</option>
    <option value="daily">每天一次</option>
  </select></div>
  <div class="sblock">
    <span class="lbl">同步後端（Cloudflare Worker）</span>
    <input type="url" id="workerUrl" placeholder="https://xxx.workers.dev">
    <input type="text" id="workerKey" placeholder="App key" style="margin-top:6px">
    <button class="mini" id="syncBtn">立即同步</button>
    <button class="mini" id="importBtn">匯入 CSV</button>
    <button class="mini" id="exportBtn">匯出 CSV</button>
    <button class="mini" id="logBtn">匯出練習紀錄</button>
    <input type="file" id="dataFile" accept=".csv,.tsv,.json" hidden>
    <div class="status" id="syncStatus"></div>
  </div>
</div>

<section id="v-study"><div id="cardHost"></div></section>

<section id="v-ledger" hidden>
  <input class="search" id="q" type="search" placeholder="搜尋英文、中文、例句或解釋…" autocomplete="off">
  <div class="lcontrols">
    <select id="secSel2" class="chip" aria-label="章節"></select>
    <button class="chip" id="trapChip2" aria-pressed="false">只看陷阱字</button>
    <span class="count" id="ledgerCount"></span>
  </div>
  <div id="ledger"></div>
</section>

<section id="v-progress" hidden>
  <div class="stats" id="stats"></div>
  <div id="boxes" style="margin-top:24px"></div>
  <h2 class="blk">記憶掛鉤</h2>
  <div id="chains"></div>
  <h2 class="blk">資料在哪</h2>
  <p id="rawState" style="font-size:13px;color:var(--ink-soft);margin-top:8px"></p>
  <button class="danger" id="resetBtn">清除所有練習狀態</button>
</section>

</div>

<script>

const hasWS=typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function";
async function get(k){
  try{
    if(hasWS){ const r=await window.storage.get(k); return r?JSON.parse(r.value):null; }
    const v=localStorage.getItem(k); return v?JSON.parse(v):null;
  }catch(e){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(_){ return null; } }
}
async function put(k,v){
  const s=JSON.stringify(v);
  try{ if(hasWS){ await window.storage.set(k,s); return; } }catch(e){}
  try{ localStorage.setItem(k,s); }catch(e){}
}
async function drop(k){
  try{ if(hasWS){ await window.storage.delete(k); return; } }catch(e){}
  try{ localStorage.removeItem(k); }catch(e){}
}

/* ================= ladder ================= */
const DAY=86400000;
const STAGES={1:{name:"認詞",code:"recog"},2:{name:"克漏字",code:"cloze"},3:{name:"打字",code:"type"}};
const LADDER={1:[0,1,2,4], 2:[0,1,3,7,14], 3:[0,1,3,8,21,60]};
const TOP={1:3,2:4,3:5};
const idOf=t=>String(t.t).toLowerCase();
function rec(t){ return PROG[idOf(t)]||{st:1,b:0,due:0,seen:0,ok:0,lapse:0,t:0}; }
function isDue(t){ const r=PROG[idOf(t)]; return !r||r.due<=Date.now(); }
function mastered(r){ return r.st===3&&r.b>=4; }
function strength(r){ return r.st===1?r.b/3*1.5 : r.st===2?1.5+r.b/4*1.5 : 3+r.b/5*2; }

function applyGrade(r,g){
  r.seen++; if(g===2) r.ok++;
  if(g===2){
    r.b++;
    if(r.b>TOP[r.st]){ if(r.st<3){ r.st++; r.b=1; } else r.b=TOP[3]; }
  } else if(g===1){
    r.b=Math.max(1,r.b);
  } else {
    r.lapse++;
    if(r.b<=1&&r.st>1){ r.st--; r.b=Math.max(1,TOP[r.st]-1); } else r.b=1;
  }
  const iv=LADDER[r.st][Math.min(r.b,LADDER[r.st].length-1)];
  r.due=Date.now()+iv*DAY; r.t=Date.now();
  return r;
}
function modeFor(t){
  if(SET.mode!=="auto") return SET.mode;
  return STAGES[rec(t).st].code;
}
function scored(t,mode){ return mode===STAGES[rec(t).st].code; }

/* ================= speech ================= */
let VOICE=null;
function pickVoice(){
  if(!window.speechSynthesis) return null;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  return vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang&&v.lang.startsWith("en"))||null;
}
if(window.speechSynthesis){ speechSynthesis.onvoiceschanged=()=>{VOICE=pickVoice();}; VOICE=pickVoice(); }
function say(text){
  if(!window.speechSynthesis||!text) return;
  try{
    speechSynthesis.cancel();
    if(speechSynthesis.paused) speechSynthesis.resume();
    setTimeout(()=>{
      try{
        const u=new SpeechSynthesisUtterance(text);
        u.lang="en-GB"; u.rate=.95; if(!VOICE) VOICE=pickVoice(); if(VOICE) u.voice=VOICE;
        speechSynthesis.speak(u);
      }catch(e){}
    },50);
  }catch(e){}
}
const spoken=t=>t.f&&t.t.length<=5?t.t+", "+t.f:t.t;
function autoSay(t,revealed){
  if(SET.tts==="off"||!t) return;
  say(spoken(t));
  if(SET.tts==="both"&&t.e) setTimeout(()=>{
    try{ const u=new SpeechSynthesisUtterance(t.e); u.lang="en-GB"; u.rate=.95; if(VOICE)u.voice=VOICE; speechSynthesis.speak(u); }catch(e){}
  },60);
}

/* ================= queue ================= */
const S={queue:[],cur:null,mode:"recog",revealed:false,answered:false,pickedWrong:null,total:0,shown:0,typed:"",verdict:null};
function pool(){
  return TERMS.filter(t=>SET.sec==="ALL"||t.s===SET.sec)
              .filter(t=>!SET.trap||t.x===1)
              .filter(t=>!SET.due||isDue(t))
              .filter(t=>SET.mode!=="trap"||t.x===1);
}
function shuffle(a){ for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]];} return a; }
function buildQueue(){
  const p=pool().map(t=>({...t}));
  const fresh=shuffle(p.filter(t=>rec(t).seen===0));
  const due=shuffle(p.filter(t=>rec(t).seen>0&&isDue(t)));
  const rest=shuffle(p.filter(t=>rec(t).seen>0&&!isDue(t)));
  let q=[...due,...fresh,...rest];
  if(SET.size>0) q=q.slice(0,SET.size);
  S.queue=q; S.total=q.length; next();
}
function next(){
  S.revealed=false; S.answered=false; S.pickedWrong=null; S.typed=""; S.verdict=null;
  S.cur=S.queue.shift()||null;
  S.mode=S.cur?(SET.mode==="trap"?"trap":modeFor(S.cur)):"recog";
  S.shown=Date.now();
  render();
}
function grade(g){
  const t=S.cur; if(!t) return;
  const key=idOf(t), r=rec(t), does=scored(t,S.mode)||SET.mode==="auto";
  const before=r.st;
  if(does){ applyGrade(r,g); PROG[key]=r; saveProg(); }
  LOG.push([t.t, Math.round(Date.now()/60000), g, S.mode, Math.min(999,Math.round((Date.now()-S.shown)/100)), before, does?1:0]);
  if(LOG.length>4000) LOG=LOG.slice(-4000);
  saveLog(); if(LOG.length%8===0) pushState(true);

function marked(term,sentence){
  const e=esc(sentence);
  const rx=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/[sz]/gi,"[sz]");
  const STOP=["the","and","for","with","over","under","not"];
  const core=String(term).replace(/\s*\(.*?\)/g," ").replace(/\s+/g," ").trim();
  const paren=(String(term).match(/\(([^()]+)\)/)||[])[1]||"";
  const words=(core+" "+paren).split(/[\s\/]+/).filter(w=>w.length>2&&!STOP.includes(w.toLowerCase())).sort((a,b)=>b.length-a.length);
  const hit=re=>re.test(e)?e.replace(re,m=>"\u0001"+m+"\u0002"):null;
  for(const c of [core,paren,...words].filter(Boolean)){
    let r=hit(new RegExp("\\b"+rx(esc(c)),"i")); if(r) return r;
    if(c.length>4){ r=hit(new RegExp("\\b"+rx(esc(c.slice(0,Math.min(c.length-1,6))))+"\\w*","i")); if(r) return r; }
  }
  return e;
}

const norm=s=>String(s).replace(/\(.*?\)/g,"").toLowerCase().replace(/[^a-z0-9£]+/g," ").trim();
function lev(a,b){
  const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n);
  let prev=[...Array(n+1).keys()],cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}

/* ================= tap + swipe ================= */
function wireCard(){
  const card=host.querySelector(".card"); if(!card||!S.cur) return;
  card.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); say(b.dataset.say==="ex"?S.cur.e:spoken(S.cur)); });
  if(S.mode==="trap"||S.mode==="type"||S.mode==="cloze") return;
  const ghost=card.querySelector(".ghost"), cs=getComputedStyle(document.documentElement);
  const LABEL={left:["Decline",cs.getPropertyValue("--seal")],right:["Approve",cs.getPropertyValue("--stamp")],up:["Refer",cs.getPropertyValue("--refer")]};
  const dirOf=(dx,dy)=>Math.abs(dx)>Math.abs(dy)?(dx<0?"left":"right"):(dy<0?"up":null);
  let sx=0,sy=0,t0=0,drag=false,active=false;
  card.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")||e.target.closest(".exline")||e.target.closest(".exwrap")) return;
    active=true;drag=false;sx=e.clientX;sy=e.clientY;t0=Date.now();
    card.setPointerCapture(e.pointerId); card.classList.add("dragging");
  });
  card.addEventListener("pointermove",e=>{
    if(!active) return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!drag&&Math.hypot(dx,dy)<8) return;
    drag=true;
    card.style.transform=`translate(${dx}px, ${Math.min(dy,40)}px) rotate(${dx*.03}deg)`;
    const d=dirOf(dx,dy),dist=Math.max(Math.abs(dx),-dy);
    if(d&&dist>25){ ghost.textContent=LABEL[d][0]; ghost.style.color=LABEL[d][1].trim(); ghost.style.opacity=Math.min(1,(dist-25)/50); }
    else ghost.style.opacity=0;
  });
  card.addEventListener("pointerup",e=>{
    if(!active) return; active=false; card.classList.remove("dragging");
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!drag&&Date.now()-t0<500){ card.style.transform="";ghost.style.opacity=0; S.revealed=!S.revealed; render(); return; }
    const d=dirOf(dx,dy),dist=Math.max(Math.abs(dx),-dy);
    if(d&&dist>60&&S.revealed){ ghost.style.opacity=0; grade(d==="left"?0:d==="up"?1:2); return; }
    card.style.transform="";ghost.style.opacity=0;
  });
  card.addEventListener("pointercancel",()=>{active=false;card.classList.remove("dragging");card.style.transform="";ghost.style.opacity=0;});
}

/* ================= deck io ================= */
function parseCSV(text){
  const rows=[]; let row=[],cell="",q=false;
  const first=text.split("\n")[0];
  const delim=first.includes("\t")&&!first.includes(",")?"\t":",";
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell);cell=""; }
    else if(ch==="\n"){ row.push(cell);rows.push(row);row=[];cell=""; }
    else if(ch!=="\r") cell+=ch;
  }
  if(cell||row.length){ row.push(cell);rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=="");
}
const ALIAS={section:"s",term:"t",full:"f","full name":"f",breakdown:"b","拆字":"b",pos:"p","詞性":"p",
  chinese_finance:"z","financial chinese":"z","中文":"z",meaning:"m","解釋":"m","def_en":"d","english definition":"d",
  pattern:"c",collocation:"c","搭配結構":"c",pattern_explain:"g","搭配結構說明":"g",note:"n","註記":"n",
  example:"e","例句":"e",trap:"x",chinese_general:"w","一般語境中文":"w"};
function normalise(o){
  o.s=(String(o.s||"A").trim()[0]||"A").toUpperCase();
  o.x=/^(1|true|yes|y|是)$/i.test(String(o.x))?1:0;
  ["t","f","b","p","c","g","e","z","m","d","n","w"].forEach(k=>o[k]=String(o[k]||"").trim());
  return o;
}
function rowsToDeck(rows){
  const hdr=rows[0].map(h=>ALIAS[h.trim().toLowerCase()]||h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.join("").trim()).map(r=>{
    const o={s:"A",t:"",f:"",b:"",p:"",c:"",g:"",e:"",z:"",m:"",d:"",n:"",w:"",x:0};
    hdr.forEach((h,i)=>{ if(h in o) o[h]=(r[i]||"").trim(); });
    return normalise(o);
  }).filter(o=>o.t);
}
function mergeDeck(incoming){
  const idx=new Map(TERMS.map((t,i)=>[t.t.toLowerCase(),i]));
  let added=0,updated=0;
  incoming.forEach(o=>{
    const k=o.t.toLowerCase();
    if(idx.has(k)){ TERMS[idx.get(k)]=Object.assign({},TERMS[idx.get(k)],o); updated++; }
    else { TERMS.push(o); idx.set(k,TERMS.length-1); added++; }
  });
  const order="ABCDEFGHIJKLMNO";
  const rank=x=>{const i=order.indexOf(x.s); return i<0?99:i;};
  TERMS.sort((a,b)=>rank(a)-rank(b));
  return {added,updated};
}
async function afterDeckChange(){
  await put(K_DECK,TERMS);
  fillSec(document.getElementById("secSel")); fillSec(document.getElementById("secSel2"));
  buildQueue();
}
function toCSV(deck){
  const cols=[["section","s"],["term","t"],["full","f"],["pos","p"],["pattern","c"],["example","e"],["chinese","z"],["meaning","m"],["note","n"],["trap","x"]];
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  return "\ufeff"+cols.map(c=>c[0]).join(",")+"\n"+
    deck.map(d=>cols.map(([,k])=>q(k==="x"?(d.x?"Yes":"No"):k==="s"?d.s+" · "+(SECTIONS[d.s]||""):d[k])).join(",")).join("\n");
}

/* ================= sync ================= */
const stat=document.getElementById("syncStatus");
function msg(s){ if(stat) stat.textContent=s; }
async function wfetch(path,opts){
  if(!SET.worker) throw new Error("no-worker");
  const r=await fetch(SET.worker.replace(/\/$/,"")+path,Object.assign({headers:{"content-type":"application/json","x-app-key":SET.key}},opts||{}));
  if(!r.ok) throw new Error("http-"+r.status);
  return r.json();
}
function mergeState(remote){
  let n=0;
  Object.keys(remote||{}).forEach(k=>{
    const a=PROG[k],b=remote[k];
    if(!a||(b.t||0)>(a.t||0)){ PROG[k]=b; n++; }
  });
  if(n) saveProg();
  return n;
}
let pushing=false;
async function pushState(quiet){
  if(!SET.worker||pushing) return;
  pushing=true;
  try{
    await wfetch("/state",{method:"POST",body:JSON.stringify({state:PROG,log:LOG})});
    LOG=[]; saveLog();
    if(!quiet) msg("練習紀錄已上傳。");
  }catch(e){ if(!quiet) msg("上傳失敗："+e.message); }
  pushing=false;
}
async function pullAll(quiet){
  if(!SET.worker) return;
  try{
    const d=await wfetch("/cards?since="+encodeURIComponent(SET.lastSync||""));
    if(d.cards&&d.cards.length){ const r=mergeDeck(d.cards.map(normalise)); await afterDeckChange();
      if(!quiet) msg(`單字庫：新增 ${r.added}、更新 ${r.updated}。`); }
    if(d.now) { SET.lastSync=d.now; saveSet(); }
    const s=await wfetch("/state");
    const n=mergeState(s.state);
    if(!quiet) msg((stat.textContent?stat.textContent+" ":"")+`練習狀態同步 ${n} 張。`);
    renderProgress();
  }catch(e){ if(!quiet) msg("同步失敗："+e.message+"（確認 Worker 網址與 key）"); }
}
async function syncNow(){
  SET.lastAuto=Date.now(); saveSet();
  const btn=document.getElementById("syncBtn"); btn.disabled=true; msg("同步中…");
  await pushState(true); await pullAll(false);
  btn.disabled=false;
}

/* ================= wiring ================= */
function fillSec(el){
  const cur=el.value;
  el.innerHTML=`<option value="ALL">全部（${TERMS.length}）</option>`+
    [...new Set(TERMS.map(t=>t.s))].sort().map(k=>{
      const n=TERMS.filter(t=>t.s===k).length;
      return `<option value="${k}">§${k} ${SECTIONS[k]||""}（${n}）</option>`;}).join("");
  if(cur) el.value=cur;
}
const sheet=document.getElementById("sheet"), gear=document.getElementById("gear");
function closeSheet(){ sheet.hidden=true; gear.setAttribute("aria-expanded","false"); }
gear.onclick=e=>{ e.stopPropagation(); const open=sheet.hidden; sheet.hidden=!open; gear.setAttribute("aria-expanded",open); };
document.addEventListener("click",e=>{ if(!sheet.hidden&&!sheet.contains(e.target)&&e.target!==gear) closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t===tab));
  ["study","ledger","progress"].forEach(v=>document.getElementById("v-"+v).hidden=(v!==tab.dataset.view));
  const study=tab.dataset.view==="study";
  gear.hidden=!study; if(!study) closeSheet();
  document.querySelector(".track").style.visibility=study?"visible":"hidden";
  if(tab.dataset.view==="ledger") renderLedger();
  if(tab.dataset.view==="progress") renderProgress();
});
function toggle(el,key){
  el.setAttribute("aria-pressed",!!SET[key]);
  el.onclick=()=>{ SET[key]=!SET[key]; el.setAttribute("aria-pressed",SET[key]); saveSet(); buildQueue(); };
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pushState(true); });

(async function init(){
  const [p,s,d,l]=await Promise.all([get(K_PROG),get(K_SET),get(K_DECK),get(K_LOG)]);
  PROG=p||{}; SET=Object.assign(SET,s||{}); LOG=l||[];
  if(!SET.notion) SET.notion=DEFAULT_NOTION;
  if(d&&d.length) TERMS=d;
  const $=id=>document.getElementById(id);
  fillSec($("secSel")); fillSec($("secSel2"));
  $("secSel").value=SET.sec; $("modeSel").value=SET.mode; $("ttsSel").value=SET.tts;
  $("sizeSel").value=String(SET.size); $("autoSel").value=SET.auto;
  $("workerUrl").value=SET.worker; $("workerKey").value=SET.key;
  $("secSel").onchange=e=>{SET.sec=e.target.value;saveSet();buildQueue();};
  $("modeSel").onchange=e=>{SET.mode=e.target.value;saveSet();buildQueue();};
  $("ttsSel").onchange=e=>{SET.tts=e.target.value;saveSet(); if(SET.tts!=="off"&&S.cur) autoSay(S.cur);};
  $("sizeSel").onchange=e=>{SET.size=+e.target.value;saveSet();buildQueue();};
  $("autoSel").onchange=e=>{SET.auto=e.target.value;saveSet();};
  $("workerUrl").onchange=e=>{SET.worker=e.target.value.trim();saveSet();};
  $("workerKey").onchange=e=>{SET.key=e.target.value.trim();saveSet();};
  toggle($("trapChip"),"trap"); toggle($("dueChip"),"due");
  $("exChip").setAttribute("aria-pressed",!!SET.showEx);
  $("exChip").onclick=()=>{ SET.showEx=!SET.showEx; $("exChip").setAttribute("aria-pressed",SET.showEx); saveSet(); render(); };
  $("syncBtn").onclick=syncNow;
  $("importBtn").onclick=()=>$("dataFile").click();
  $("dataFile").onchange=async()=>{
    const f=$("dataFile").files[0]; if(!f) return;
    try{
      const txt=await f.text();
      const deck=f.name.endsWith(".json")?JSON.parse(txt).map(normalise):rowsToDeck(parseCSV(txt));
      if(!deck.length) throw new Error("empty");
      TERMS=deck; await afterDeckChange(); msg(`已載入 ${deck.length} 條。`);
    }catch(err){ msg("讀不到這個檔案，確認第一列是欄位名稱。"); }
    $("dataFile").value="";
  };
  $("exportBtn").onclick=()=>{
    const blob=new Blob([toCSV(TERMS)],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="underwriting-glossary.csv"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("logBtn").onclick=()=>{
    const rows=[["term","reviewed_at","grade","mode","elapsed_ms","stage_before","scored"]];
    LOG.forEach(([term,m,g,mode,ds,stg,sc])=>rows.push([term,new Date(m*60000).toISOString(),["decline","refer","approve"][g],mode,ds*100,stg,sc]));
    const q=v=>`"${String(v).replace(/"/g,'""')}"`;
    const blob=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="review-log.csv"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("resetBtn").onclick=async()=>{
    if(!confirm("清除所有練習狀態？此動作無法復原。")) return;
    PROG={}; LOG=[]; await drop(K_PROG);
    renderProgress(); buildQueue();
  };
  buildQueue();
  const stale=SET.auto==="open"||(SET.auto==="daily"&&Date.now()-(SET.lastAuto||0)>20*3600*1000);
  if(SET.worker){ await pullAll(true); if(stale){ SET.lastAuto=Date.now(); saveSet(); } }
})();

</script>
